name: Refresh WeChat and technical blogs

on:
  workflow_dispatch:
  schedule:
    - cron: '27 */4 * * *'

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    environment: wechat-collection
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SNAPSHOT_KEY: public-wechat-v1-${{ github.run_id }}-${{ github.run_attempt }}
    outputs:
      reader_ok: ${{ steps.report.outputs.reader_ok }}
      blogs_ok: ${{ steps.blogs.outputs.blogs_ok }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/cache/restore@v6
        with:
          path: dist/wechat-preview/wechat.json
          key: ${{ env.SNAPSHOT_KEY }}
          restore-keys: public-wechat-v1-
      - name: Restore published archives
        shell: bash
        run: |
          mkdir -p dist/wechat-preview
          for name in wechat blogs; do
            file="dist/wechat-preview/$name.json"
            if [[ -s "$file" ]]; then continue; fi
            status=$(curl --silent --show-error --location --retry 2 --max-time 45 --output "$RUNNER_TEMP/previous.json" --write-out '%{http_code}' "https://linyouxue.github.io/AIfrontier/$name.json?run=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT")
            case "$status" in
              200) jq -e '(.items | type == "array") and (.sources | type == "array")' "$RUNNER_TEMP/previous.json" >/dev/null
                   cp "$RUNNER_TEMP/previous.json" "$file" ;;
              404) echo "No previous public $name archive" ;;
              *) echo "::error::Unable to restore $name (HTTP $status)"; exit 1 ;;
            esac
          done
      - name: Collect and render public WeChat articles
        env:
          AIFRONTIER_WEREAD_COOKIE: ${{ secrets.AIFRONTIER_WEREAD_COOKIE }}
        run: |
          python3 scripts/collect_public_wechat.py --with-reader
          python3 scripts/render_wechat_preview.py
      - name: Collect and publish technical blogs
        id: blogs
        run: |
          python3 scripts/collect_blogs.py
          python3 scripts/render_blogs.py
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads(Path('dist/wechat-preview/blogs.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              print("### 技术博客\n\n| 来源 | 检查成功 | 本轮新增 | 近三个月收录 |", file=summary)
              print("|---|---:|---:|---:|", file=summary)
              for kind, label in [('author', '个人'), ('team', '团队')]:
                  rows = [s for s in data['sources'] if s['kind'] == kind]
                  print(f"| {label} | {sum(s['status']=='ok' for s in rows)}/{len(rows)} | "
                        f"{sum(s['inserted'] for s in rows)} | {sum(i['kind']==kind for i in data['items'])} |", file=summary)
              for row in data['sources']:
                  if row['status'] != 'ok':
                      message = f"{row['id']} · {row['error']}"
                      print(f"::warning::{message}")
                      print(f"\n读取失败 · {message}", file=summary)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              print('blogs_ok=' + str(any(s['status']=='ok' for s in data['sources'])).lower(), file=out)
          PY
      - name: Report source coverage
        id: report
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads(Path('dist/wechat-preview/wechat.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              print(f"共保留 {len(data['items'])} 篇文章", file=summary)
              print("\n| 渠道 | 账号 | 成功检查 | 待核验或失败 | 候选 | 新增 | 已收录 | 筛除 |", file=summary)
              print("|---|---:|---:|---:|---:|---:|---:|---:|", file=summary)
              for platform in ('rss', 'weread'):
                  rows = [s for s in data['sources'] if s['platform'] == platform]
                  ok = sum(s['status'] == 'ok' for s in rows)
                  counts = [sum(s[k] for s in rows) for k in ('discovered', 'inserted', 'matched', 'filtered')]
                  print('| ' + ' | '.join(map(str, (platform, len(rows), ok, len(rows)-ok, *counts))) + ' |', file=summary)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              print('reader_ok=' + str(any(s['platform']=='weread' and s['status']=='ok' for s in data['sources'])).lower(), file=out)
          PY
      - uses: actions/cache/save@v6
        with:
          path: dist/wechat-preview/wechat.json
          key: ${{ env.SNAPSHOT_KEY }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/wechat-preview/site

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Check WeRead availability
        if: needs.collect.outputs.reader_ok != 'true'
        run: |
          echo "::error::No WeRead account could be verified. Check source status and the WeRead session. Retained articles and public RSS updates have been deployed."
          exit 1
      - name: Check blog availability
        if: always() && needs.collect.outputs.blogs_ok == 'false'
        run: |
          echo "::error::All blog sources failed. See the collection summary."
          exit 1
