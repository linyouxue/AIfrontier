name: Refresh AIfrontier publications

on:
  workflow_dispatch:
    inputs:
      force_arxiv:
        description: Recheck official arXiv announcements even if today's batch was verified
        type: boolean
        default: false
  schedule:
    - cron: '27 */4 * * *'

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    environment: wechat-collection
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      SNAPSHOT_KEY: public-wechat-v1-${{ github.run_id }}-${{ github.run_attempt }}
    outputs:
      reader_ok: ${{ steps.report.outputs.reader_ok }}
      blogs_ok: ${{ steps.blogs.outputs.blogs_ok }}
      papers_ok: ${{ steps.papers.outputs.fresh }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/cache/restore@v6
        with:
          path: dist/wechat-preview/wechat.json
          key: ${{ env.SNAPSHOT_KEY }}
          restore-keys: public-wechat-v1-
      - name: Restore published archives
        shell: bash
        run: |
          mkdir -p dist/wechat-preview
          for name in wechat blogs social; do
            file="dist/wechat-preview/$name.json"
            if [[ -s "$file" ]]; then continue; fi
            status=$(curl --silent --show-error --location --retry 2 --max-time 45 --output "$RUNNER_TEMP/previous.json" --write-out '%{http_code}' "https://linyouxue.github.io/AIfrontier/$name.json?run=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT")
            case "$status" in
              200) jq -e '(.items | type == "array") and (.sources | type == "array")' "$RUNNER_TEMP/previous.json" >/dev/null
                   cp "$RUNNER_TEMP/previous.json" "$file" ;;
              404) echo "No previous public $name archive" ;;
              *) echo "::error::Unable to restore $name (HTTP $status)"; exit 1 ;;
            esac
          done
      - name: Collect and render public WeChat articles
        env:
          AIFRONTIER_WEREAD_COOKIE: ${{ secrets.AIFRONTIER_WEREAD_COOKIE }}
        run: |
          python3 scripts/collect_public_wechat.py --with-reader
          python3 scripts/render_wechat_preview.py
      - name: Collect and publish technical blogs
        id: blogs
        run: |
          python3 scripts/collect_blogs.py
          python3 scripts/render_blogs.py
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads(Path('dist/wechat-preview/blogs.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              print("### 技术博客\n\n| 来源 | 检查成功 | 本轮新增 | 近三个月收录 |", file=summary)
              print("|---|---:|---:|---:|", file=summary)
              for kind, label in [('author', '个人'), ('team', '团队')]:
                  rows = [s for s in data['sources'] if s['kind'] == kind]
                  print(f"| {label} | {sum(s['status']=='ok' for s in rows)}/{len(rows)} | "
                        f"{sum(s['inserted'] for s in rows)} | {sum(i['kind']==kind for i in data['items'])} |", file=summary)
              for row in data['sources']:
                  if row['status'] != 'ok':
                      message = f"{row['id']} · {row['error']}"
                      print(f"::warning::{message}")
                      print(f"\n读取失败 · {message}", file=summary)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              print('blogs_ok=' + str(any(s['status']=='ok' for s in data['sources'])).lower(), file=out)
          PY
      - name: Start the Xiaohongshu reader
        env:
          XIAOHONGSHU_COOKIE: ${{ secrets.XIAOHONGSHU_COOKIE }}
        run: |
          if [[ -z "$XIAOHONGSHU_COOKIE" ]]; then
            echo "::notice::Xiaohongshu awaits the XIAOHONGSHU_COOKIE secret"
            exit 0
          fi
          echo "AIFRONTIER_RSSHUB_URL=http://127.0.0.1:1200" >> "$GITHUB_ENV"
          image=ghcr.io/diygod/rsshub@sha256:40f115be9967377880b2ea62ecf5d4fd4b1820c15518dd9146f3b874464ffdb2
          if docker run -d --rm --name social-rsshub --log-driver=none -p 127.0.0.1:1200:1200 -e XIAOHONGSHU_COOKIE "$image"; then
            curl --fail --silent --retry 12 --retry-connrefused --retry-delay 2 --max-time 4 http://127.0.0.1:1200/healthz >/dev/null || echo "::warning::RSSHub has not become ready"
          else
            echo "::warning::RSSHub did not start"
          fi
      - name: Collect and publish account updates
        run: |
          python3 scripts/collect_social.py
          python3 scripts/render_social.py
          jq -r '.sources[] | [.name, .status, (.inserted|tostring)] | join(" · ")' dist/wechat-preview/social.json >> "$GITHUB_STEP_SUMMARY"
      - name: Restore the published paper catalog and votes
        shell: bash
        run: |
          mkdir -p dist/wechat-preview/paper-work
          for name in archive.json.gz paper-heat.json; do
            file="dist/wechat-preview/paper-work/$name"
            status=$(curl --silent --show-error --location --retry 2 --max-time 120 --output "$file" --write-out '%{http_code}' "https://linyouxue.github.io/AIfrontier/papers/$name?run=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT")
            case "$status" in
              200) ;;
              404) rm "$file" ;;
              *) echo "::error::Cannot restore $name (HTTP $status)"; exit 1 ;;
            esac
          done
          if [[ ! -s dist/wechat-preview/paper-work/archive.json.gz ]]; then
            echo "Restoring the verified arXiv baseline for the first publication"
            curl --fail --location --silent --show-error --retry 2 --max-time 180 \
              https://github.com/linyouxue/AIfrontier/releases/download/arxiv-baseline-20261118/archive.json.gz \
              -o dist/wechat-preview/paper-work/archive.json.gz
          fi
      - name: Collect arXiv announcements, refresh community votes and build the paper directory
        id: papers
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          FORCE_ARXIV: ${{ inputs.force_arxiv }}
        run: python3 -u scripts/publish_papers.py
      - name: Report source coverage
        id: report
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads(Path('dist/wechat-preview/wechat.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              print(f"共保留 {len(data['items'])} 篇文章", file=summary)
              print("\n| 渠道 | 账号 | 成功检查 | 待核验或失败 | 候选 | 新增 | 已收录 | 筛除 |", file=summary)
              print("|---|---:|---:|---:|---:|---:|---:|---:|", file=summary)
              for platform in ('rss', 'weread'):
                  rows = [s for s in data['sources'] if s['platform'] == platform]
                  ok = sum(s['status'] == 'ok' for s in rows)
                  counts = [sum(s[k] for s in rows) for k in ('discovered', 'inserted', 'matched', 'filtered')]
                  print('| ' + ' | '.join(map(str, (platform, len(rows), ok, len(rows)-ok, *counts))) + ' |', file=summary)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              print('reader_ok=' + str(any(s['platform']=='weread' and s['status']=='ok' for s in data['sources'])).lower(), file=out)
          PY
      - uses: actions/cache/save@v6
        with:
          path: dist/wechat-preview/wechat.json
          key: ${{ env.SNAPSHOT_KEY }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/wechat-preview/site

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Check WeRead availability
        if: needs.collect.outputs.reader_ok != 'true'
        run: |
          echo "::error::No WeRead account could be verified. Check source status and the WeRead session. Retained articles and public RSS updates have been deployed."
          exit 1
      - name: Check blog availability
        if: always() && needs.collect.outputs.blogs_ok == 'false'
        run: |
          echo "::error::All blog sources failed. See the collection summary."
          exit 1
      - name: Check arXiv and community votes
        if: always() && needs.collect.outputs.papers_ok == 'false'
        run: |
          echo "::error::The paper directory was rebuilt with retained data. Check the collection log."
          exit 1
