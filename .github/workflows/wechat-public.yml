name: Refresh public WeChat feeds

on:
  workflow_dispatch:
  schedule:
    - cron: '27 */4 * * *'

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SNAPSHOT_KEY: public-wechat-v1-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/cache/restore@v6
        with:
          path: dist/wechat-preview/wechat.json
          key: ${{ env.SNAPSHOT_KEY }}
          restore-keys: public-wechat-v1-
      - name: Collect and render public WeChat articles
        run: |
          python3 scripts/collect_public_wechat.py
          python3 scripts/render_wechat_preview.py
      - uses: actions/cache/save@v6
        with:
          path: dist/wechat-preview/wechat.json
          key: ${{ env.SNAPSHOT_KEY }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/wechat-preview/site

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
